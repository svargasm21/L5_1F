<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aGreen" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1b7f3b"/></marker>
    <marker id="aBlue" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2d77c9"/></marker>
    <marker id="aRed" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
  </defs>

  <rect x="0" y="0" width="1000" height="1180" fill="#f6f8fb"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b7f3b">Deployment View · Laboratorio 5 – Segmentación de red</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#5a6b7b">Patrón: aislamiento por zonas (trust boundaries) · Compose project l5-despues · escenario DESPUÉS (segmentado)</text>

  <!-- ============ ZONE BANDS horizontales apiladas (top-down) ============ -->
  <!-- Cada zona: franja horizontal de igual ancho (60..940) -->
  <rect x="60" y="90"  width="880" height="150" rx="10" fill="#eef3f9" stroke="#8aa0b6" stroke-width="1.4"/>
  <rect x="60" y="270" width="880" height="180" rx="10" fill="#eaf3ff" stroke="#2d77c9" stroke-width="1.8"/>
  <rect x="60" y="480" width="880" height="180" rx="10" fill="#eafaf0" stroke="#1b7f3b" stroke-width="1.8"/>
  <rect x="60" y="690" width="880" height="180" rx="10" fill="#fdecef" stroke="#c0392b" stroke-width="1.8"/>

  <!-- zone headers (en la esquina de cada franja) -->
  <text x="78" y="114" font-size="13" font-weight="700" fill="#44586c">USER ZONE · Internet / LAN (untrusted)</text>
  <text x="78" y="294" font-size="13" font-weight="700" fill="#2d77c9">ZONA PÚBLICA · public_net</text>
  <text x="78" y="312" font-size="10" fill="#5a6b7b">bridge · única red con un puerto publicado al host</text>
  <text x="78" y="504" font-size="13" font-weight="700" fill="#1b7f3b">ZONA DE APLICACIÓN · app_net</text>
  <text x="78" y="522" font-size="10" fill="#5a6b7b">internal: true · sin salida a Internet · sin puertos publicados</text>
  <text x="78" y="714" font-size="13" font-weight="700" fill="#c0392b">ZONA DE DATOS · data_net</text>
  <text x="78" y="732" font-size="10" fill="#5a6b7b">internal: true · aislada · solo accesible desde el backend</text>

  <!-- trust boundary crítico: línea entre APLICACIÓN y DATOS -->
  <line x1="60" y1="675" x2="940" y2="675" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <rect x="690" y="664" width="250" height="20" rx="4" fill="#fdecef"/>
  <text x="815" y="678" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="700">trust boundary crítico (pública ↔ datos)</text>

  <!-- ============ NODES centrados en cada franja, misma columna (x=400..600) ============ -->
  <!-- Browser -->
  <rect x="400" y="120" width="200" height="90" rx="8" fill="#ffffff" stroke="#2d77c9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="412" y="138" font-size="9" fill="#8a97a6">«device» / «execEnv»</text>
  <text x="412" y="156" font-size="13" font-weight="700" fill="#1f2d3d">Browser / curl</text>
  <text x="412" y="174" font-size="9.5" fill="#5a6b7b">curl localhost</text>
  <text x="412" y="190" font-size="9.5" fill="#5a6b7b">curl localhost/api/health</text>

  <!-- gateway (rojo) -->
  <rect x="380" y="300" width="240" height="130" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8" filter="url(#sh)"/>
  <text x="392" y="318" font-size="9" fill="#8a97a6">«container»</text>
  <text x="392" y="335" font-size="13" font-weight="700" fill="#1f2d3d">gateway</text>
  <text x="392" y="352" font-size="9.5" fill="#5a6b7b">nginx:alpine · publica :80</text>
  <text x="392" y="367" font-size="9.5" fill="#5a6b7b">networks: public_net + app_net</text>
  <rect x="392" y="378" width="216" height="44" rx="5" fill="#fff5f5" stroke="#e3a9a9"/>
  <text x="400" y="394" font-size="8.5" fill="#8a97a6">«artifact» nginx.conf</text>
  <text x="400" y="408" font-size="9" fill="#5a6b7b">/ → "gateway ok"</text>
  <text x="400" y="420" font-size="9" fill="#5a6b7b">/api/ → proxy_pass backend:3000</text>

  <!-- puerto 80 (cuadrito amarillo en el borde superior de la zona pública) -->
  <rect x="489" y="259" width="22" height="22" fill="#ffd54a" stroke="#b8860b"/>
  <text x="500" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5c00">80</text>

  <!-- backend (verde) -->
  <rect x="380" y="510" width="240" height="130" rx="8" fill="#ffffff" stroke="#1b7f3b" stroke-width="1.8" filter="url(#sh)"/>
  <text x="392" y="528" font-size="9" fill="#8a97a6">«container»</text>
  <text x="392" y="545" font-size="13" font-weight="700" fill="#1f2d3d">backend</text>
  <text x="392" y="562" font-size="9.5" fill="#5a6b7b">node:20-alpine · GET /health · :3000</text>
  <text x="392" y="577" font-size="9.5" fill="#5a6b7b">networks: app_net + data_net</text>
  <rect x="392" y="588" width="216" height="44" rx="5" fill="#f3fbf6" stroke="#aedcc1"/>
  <text x="400" y="604" font-size="8.5" fill="#8a97a6">«artifact» server.js (driver pg)</text>
  <text x="400" y="618" font-size="9" fill="#5a6b7b">único puente app ↔ datos</text>
  <text x="400" y="630" font-size="9" fill="#5a6b7b">resp: {"status":"ok","db":"up"}</text>

  <!-- db (verde) -->
  <rect x="380" y="720" width="240" height="130" rx="8" fill="#ffffff" stroke="#1b7f3b" stroke-width="1.8" filter="url(#sh)"/>
  <text x="392" y="738" font-size="9" fill="#8a97a6">«container»</text>
  <text x="392" y="755" font-size="13" font-weight="700" fill="#1f2d3d">db</text>
  <text x="392" y="772" font-size="9.5" fill="#5a6b7b">postgres:16-alpine · :5432</text>
  <text x="392" y="787" font-size="9.5" fill="#5a6b7b">SIN "ports" (no publicada)</text>
  <text x="392" y="802" font-size="9.5" fill="#5a6b7b">networks: data_net</text>
  <rect x="392" y="812" width="216" height="32" rx="5" fill="#f3fbf6" stroke="#aedcc1"/>
  <text x="400" y="826" font-size="8.5" fill="#8a97a6">data store · DB appdb</text>
  <text x="400" y="838" font-size="9" fill="#5a6b7b">Docker DNS: db:5432</text>

  <!-- ============ CONNECTORS PERMITIDOS: líneas rectas VERTICALES (centro x=500) ============ -->
  <!-- C1 browser -> port80 -> gateway -->
  <line x1="500" y1="210" x2="500" y2="298" stroke="#2d77c9" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <text x="512" y="250" font-size="9.5" fill="#2d77c9" font-weight="700">C1 · HTTP :80</text>

  <!-- C2 gateway -> backend -->
  <line x1="500" y1="430" x2="500" y2="508" stroke="#1b7f3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <text x="512" y="472" font-size="9.5" fill="#1b7f3b" font-weight="700">C2 · /api/→:3000</text>

  <!-- C3 backend -> db -->
  <line x1="500" y1="640" x2="500" y2="718" stroke="#1b7f3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <text x="512" y="682" font-size="9.5" fill="#1b7f3b" font-weight="700">C3 · :5432</text>

  <!-- ============ CONNECTORS BLOQUEADOS: ortogonales por un canal lateral derecho ============ -->
  <!-- C4 gateway -> db : sale de gateway por la derecha (x=620), sube a canal x=760, baja hasta db, con corte en el trust boundary -->
  <polyline points="620,365 760,365 760,785 622,785" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#aRed)"/>
  <circle cx="760" cy="675" r="9" fill="#fdecef" stroke="#c0392b" stroke-width="2"/>
  <line x1="754" y1="669" x2="766" y2="681" stroke="#c0392b" stroke-width="2"/>
  <line x1="766" y1="669" x2="754" y2="681" stroke="#c0392b" stroke-width="2"/>
  <rect x="640" y="400" width="200" height="30" rx="5" fill="#ffffff" stroke="#e3a9a9"/>
  <text x="740" y="412" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">C4 · gateway → db (nc 5432)</text>
  <text x="740" y="424" text-anchor="middle" font-size="8.5" fill="#c0392b">BLOQUEADO — Try again / timed out</text>

  <!-- C5 exterior -> db:15432 : sale de browser por la derecha (x=600), sube a canal x=870, baja hasta db -->
  <polyline points="600,165 870,165 870,805 622,805" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#aRed)"/>
  <circle cx="870" cy="675" r="9" fill="#fdecef" stroke="#c0392b" stroke-width="2"/>
  <line x1="864" y1="669" x2="876" y2="681" stroke="#c0392b" stroke-width="2"/>
  <line x1="876" y1="669" x2="864" y2="681" stroke="#c0392b" stroke-width="2"/>
  <rect x="770" y="210" width="170" height="30" rx="5" fill="#ffffff" stroke="#e3a9a9"/>
  <text x="855" y="222" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">C5 · Exterior → db :15432</text>
  <text x="855" y="234" text-anchor="middle" font-size="8.5" fill="#c0392b">BLOQUEADO — sin puerto publicado</text>

  <!-- ============ KEY ============ -->
  <rect x="60" y="900" width="430" height="240" rx="8" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="76" y="922" font-size="12" font-weight="700" fill="#1f2d3d">KEY (notación)</text>
  <rect x="76" y="934" width="16" height="13" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
  <text x="100" y="945" font-size="9.5" fill="#5a6b7b">«container» rojo = gateway (zona pública)</text>
  <rect x="76" y="954" width="16" height="13" fill="#ffffff" stroke="#1b7f3b" stroke-width="1.6"/>
  <text x="100" y="965" font-size="9.5" fill="#5a6b7b">«container» verde = aplicación / datos</text>
  <rect x="76" y="974" width="16" height="13" fill="#ffd54a" stroke="#b8860b"/>
  <text x="100" y="985" font-size="9.5" fill="#5a6b7b">puerto publicado al host (solo :80)</text>
  <rect x="76" y="994" width="16" height="13" fill="#eaf3ff" stroke="#2d77c9"/>
  <text x="100" y="1005" font-size="9.5" fill="#5a6b7b">zona / red Docker = trust boundary</text>
  <line x1="76" y1="1026" x2="100" y2="1026" stroke="#1b7f3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
  <text x="108" y="1030" font-size="9.5" fill="#5a6b7b">flujo permitido (la aplicación funciona)</text>
  <line x1="76" y1="1048" x2="100" y2="1048" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#aRed)"/>
  <text x="108" y="1052" font-size="9.5" fill="#5a6b7b">flujo bloqueado (ataque detenido)</text>
  <circle cx="86" cy="1070" r="7" fill="#fdecef" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="81" y1="1065" x2="91" y2="1075" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="91" y1="1065" x2="81" y2="1075" stroke="#c0392b" stroke-width="1.6"/>
  <text x="108" y="1074" font-size="9.5" fill="#5a6b7b">punto donde se corta la conexión</text>
  <text x="76" y="1100" font-size="8.5" fill="#8a97a6">Dirección de la flecha = quién abre la conexión (cliente → servidor).</text>
  <text x="76" y="1114" font-size="8.5" fill="#8a97a6">Etiqueta del conector = ID · protocolo · puerto.</text>
  <text x="76" y="1128" font-size="8.5" fill="#8a97a6">Solo el puerto 80 se publica; el resto vive en las redes internas.</text>

  <!-- ============ CONNECTOR CATALOG ============ -->
  <rect x="510" y="900" width="430" height="240" rx="8" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="526" y="922" font-size="12" font-weight="700" fill="#1f2d3d">CONNECTOR CATALOG</text>
  <line x1="520" y1="930" x2="930" y2="930" stroke="#e1e7ee"/>
  <text x="526" y="946" font-size="8.5" font-weight="700" fill="#44586c">ID · Origen → Destino · Protocolo</text>
  <text x="526" y="960" font-size="8.5" font-weight="700" fill="#44586c">Resultado (escenario segmentado)</text>
  <line x1="520" y1="968" x2="930" y2="968" stroke="#eef2f6"/>

  <text x="526" y="986" font-size="9" fill="#2d77c9" font-weight="700">C1</text><text x="552" y="986" font-size="9" fill="#5a6b7b">Exterior → gateway · HTTP :80</text>
  <text x="820" y="986" font-size="9" fill="#1b7f3b" font-weight="600">Responde</text>
  <text x="526" y="1008" font-size="9" fill="#1b7f3b" font-weight="700">C2</text><text x="552" y="1008" font-size="9" fill="#5a6b7b">gateway → backend · /api/ :3000</text>
  <text x="820" y="1008" font-size="9" fill="#1b7f3b" font-weight="600">Responde</text>
  <text x="526" y="1030" font-size="9" fill="#1b7f3b" font-weight="700">C3</text><text x="552" y="1030" font-size="9" fill="#5a6b7b">backend → db · SQL :5432</text>
  <text x="820" y="1030" font-size="9" fill="#1b7f3b" font-weight="600">Conecta</text>
  <text x="526" y="1052" font-size="9" fill="#c0392b" font-weight="700">C4</text><text x="552" y="1052" font-size="9" fill="#5a6b7b">gateway → db · TCP :5432</text>
  <text x="820" y="1052" font-size="9" fill="#c0392b" font-weight="700">FALLA</text>
  <text x="526" y="1074" font-size="9" fill="#c0392b" font-weight="700">C5</text><text x="552" y="1074" font-size="9" fill="#5a6b7b">Exterior → db · TCP :15432</text>
  <text x="820" y="1074" font-size="9" fill="#c0392b" font-weight="700">FALLA</text>
  <line x1="520" y1="1088" x2="930" y2="1088" stroke="#eef2f6"/>
  <text x="526" y="1106" font-size="8" fill="#8a97a6">C1–C3: la aplicación sigue funcionando.</text>
  <text x="526" y="1120" font-size="8" fill="#8a97a6">C4 y C5: demuestran el patrón de segmentación.</text>
  <text x="526" y="1134" font-size="8" fill="#8a97a6">El 100% de los intentos pública → datos fallan.</text>
</svg>
